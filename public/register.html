      @layer base {

    <section class="bg-gray-50 dark:bg-gray-900">

          <div class="p-6 space-y-4 md:space-y-6 sm:p-8">

            >
              Create an account
            </h1>
            <form
              class="space-y-4 md:space-y-6"
              action="#"
              onsubmit="signup(event)"

              <div>
                <label
                  for="email"
                  class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                  >Your email</label

                <input
                  type="email"
                  name="email"
                  id="email"

                  placeholder="name@company.com"
                  required=""
                  pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$"
                />
              </div>
              <div>
                <label
                  for="name"
                  class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                  >Your name</label
                >
                <input
                  type="text"
                  name="name"
                  id="name"
                  class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                  placeholder="abc"
                  required=""
                />
              </div>
              <div>
                <label
                  for="password"
                  class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                  >Password</label
                >
                <input
                  type="password"
                  name="password"
                  id="password"
                  placeholder="••••••••"
                  class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                  required=""
                />
              </div>
              <div>
                <label
                  for="confirmPassword"
                  class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                  >Confirm password</label
                >
                <input
                  type="password"
                  name="confirm-password"
                  id="confirmPassword"
                  placeholder="••••••••"
                  class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                  required=""
                />
              </div>
              <div class="flex items-start">
                <div class="flex items-center h-5">
                  <input
                    id="terms"
                    aria-describedby="terms"
                    type="checkbox"
                    class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-primary-300 dark:bg-gray-700 dark:border-gray-600 dark:focus:ring-primary-600 dark:ring-offset-gray-800"
                    required=""
                  />
                </div>
                <div class="ml-3 text-sm">
                  <label
                    for="terms"
                    class="font-light text-gray-500 dark:text-gray-300"
                    >I accept the
                    <a
                      class="font-medium text-primary-600 hover:underline dark:text-primary-500"
                      href="#"
                      >Terms and Conditions</a
                    ></label
                  >
                </div>
              </div>
              <button
                type="submit"
                class="w-full text-white bg-cyan-600 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:focus:ring-primary-800"
              >
                Create an account
              </button>
              <p class="text-sm font-light text-gray-500 dark:text-gray-400">
                Already have an account?
                <a
                  href="login.html"
                  class="font-medium text-primary-600 hover:underline dark:text-primary-500"
                  >Login here</a
                >
              </p>
            </form>
          </div>

        <button

    <script src="https://flowbite.com/docs/flowbite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/toast.js"></script>
    <script src="js/api/database.js"></script>
    <script src="js/24880019.js"></script>
    <script>
      let password = document.getElementById("password");
      let confirmPassword = document.getElementById("confirmPassword");

      function validatePasswords() {
        if (password.value !== confirmPassword.value) {
          confirmPassword.setCustomValidity("Passwords must match!");
          confirmPassword.reportValidity();
        } else {
          confirmPassword.setCustomValidity("");
        }
      }

      async function signup(e) {
        e.preventDefault();

        const email = document.querySelector("#email").value.trim();
        const name = document.querySelector("#name").value.trim();
        const pwd = password.value;
        const confirm = confirmPassword.value;

        if (!email || !name || !pwd) {
          showToast("error", "Email, name, or password cannot be empty!");
          return;
        }

        if (pwd !== confirm) {
          showToast("error", "Password and confirm password must match!");
          return;
        }

        const createBtn = document.querySelector("button[type=submit]");

        try {
          createBtn.innerText = "Creating an account...";

          // 1. Đăng ký Supabase
          await supabaseSignup(email, pwd, name);

          // 2. Đợi session sync (QUAN TRỌNG)
          const {
            data: { session },
          } = await client.auth.getSession();

          // 3. Cập nhật UI ngay (fix lỗi footer không đổi)
          if (typeof initAuthUI === "function") {
            initAuthUI(session);
          }

          // 4. Redirect sau khi auth ổn định
          setTimeout(() => {
            window.location.replace("blogs.html");
          }, 300);
        } catch (error) {
          console.error("Register Error", error);
          createBtn.innerText = "Create an account";
          showToast("error", `Register Error: ${error.message}`);
        }
      }

      password.onchange = validatePasswords;
      confirmPassword.onkeyup = validatePasswords;
    </script>
  </body>
